[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groupsorter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "msoffcrypto-tool>=5.4",
    "olefile<0.47",
]

[project.scripts]
groupsorter = "groupsorter.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pyinstaller>=6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
